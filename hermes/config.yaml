name: Hermes Agent
slug: hermes_agent
description: Hermes Agent running inside Home Assistant OS
version: "0.1.0"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false

ports:
  8642/tcp: 8642
  9119/tcp: 9119

ports_description:
  8642/tcp: Hermes Gateway / OpenAI-compatible API
  9119/tcp: Hermes Dashboard

options:
  api_server_enabled: true
  api_server_key: ""
  dashboard_enabled: true
  dashboard_insecure: false
  cors_origins: "*"
  extra_env: []

schema:
  api_server_enabled: bool
  api_server_key: password
  dashboard_enabled: bool
  dashboard_insecure: bool
  cors_origins: str
  extra_env:
    - name: str
      value: password