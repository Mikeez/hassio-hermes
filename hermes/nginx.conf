worker_processes 1;
pid /var/run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 0;

    access_log /dev/stdout;

    upstream hermes_api {
        server 127.0.0.1:8642;
    }

    upstream hermes_dashboard {
        server 127.0.0.1:9119;
    }

    # HA Ingress sends X-Ingress-Path; forward it to the dashboard so
    # the SPA can construct correct base-relative URLs.
    map $http_x_ingress_path $dashboard_prefix {
        default "$http_x_ingress_path/dashboard";
        ""      "/dashboard";
    }

    server {
        listen 49268;
        server_name _;

        # Landing page (unified UI)
        location = / {
            root /var/www;
            try_files /landing.html =404;
            add_header Cache-Control "no-cache";
        }

        # Loading page (auto-refresh, served while services start)
        location = /loading.html {
            root /var/www;
            add_header Cache-Control "no-cache";
        }

        # OpenAI-compatible API
        location /v1/ {
            proxy_pass http://hermes_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Hermes Dashboard
        location = /dashboard { return 302 /dashboard/; }
        location /dashboard/api/ {
            proxy_pass http://hermes_dashboard/api/;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix $dashboard_prefix;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
        location /dashboard/ {
            proxy_pass http://hermes_dashboard/;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix $dashboard_prefix;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
